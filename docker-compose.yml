version: '3.8'

services:
  # Development PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ibvap_postgres
    environment:
      POSTGRES_DB: ibvap
      POSTGRES_USER: ibvap
      POSTGRES_PASSWORD: ibvap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Planned Microservices (To be enabled in future phases)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: ../integration/docker/backend/Dockerfile
